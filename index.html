<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Musik Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .player-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #333; }
        audio { width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>🎵 Putar Musik Saya</h2>
        <!-- Ganti 'nama_file_musik_anda.mp3' sesuai nama file yang Anda upload -->
        <audio controls>
            <source src="edsheeranperfect.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio ini.
        </audio>
    </div>

</body>
</html>
