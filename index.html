<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Musik</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .music-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .cover-art {
            width: 150px;
            height: 150px;
            background: #fff;
            color: #2a5298;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h2 { margin: 10px 0 5px; font-size: 22px; }
        p { margin: 0 0 25px; color: #ddd; font-size: 14px; }
        audio { width: 100%; border-radius: 30px; }
    </style>
</head>
<body>

    <div class="music-card">
        <div class="cover-art">🎵</div>
        <!-- Ubah Judul Lagu & Artis Di Sini -->
        <h2>Judul Musik Anda</h2>
        <p>Nama Artis / Penyanyi</p>
        
        <!-- PENTING: Ganti 'lagu.mp3' sesuai nama file musik yang Anda upload ke GitHub -->
        <audio controls>
            <source src="edsheeranperfect.mp3" type="audio/mpeg">
            Browser Anda tidak mendukung pemutar audio ini.
        </audio>
    </div>

</body>
</html>
